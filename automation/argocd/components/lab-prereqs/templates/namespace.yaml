apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.lab.namespace }}
  labels:
    demo.redhat.com/application: field-content
---
# The Showroom terminal runs as this ServiceAccount; grant only what the exercises need.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: showroom-terminal
  namespace: {{ .Values.lab.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
subjects:
  - kind: ServiceAccount
    name: showroom
    namespace: {{ .Values.showroom.namespace }}
